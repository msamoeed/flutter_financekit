name: flutter_financekit
description: >-
  A Flutter plugin for Apple FinanceKit. Access financial accounts,
  balances, and transactions from Apple Wallet on iOS 17.4+.
version: 1.0.0+1
homepage: https://github.com/abdulmoeed/flutter_financekit
repository: https://github.com/abdulmoeed/flutter_financekit
issue_tracker: https://github.com/abdulmoeed/flutter_financekit/issues
topics:
  - financekit
  - finance
  - apple-wallet
  - ios
  - payments

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterFinancekitPlugin
